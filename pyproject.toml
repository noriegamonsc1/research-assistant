[project]
name = "research-assistant"
version = "0.1.0"
description = "Domain-agnostic research direction-finding agent"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "langgraph>=0.2",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6",
  "rapidfuzz>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["research_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
